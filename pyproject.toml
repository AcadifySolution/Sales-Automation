[project]
name = "nexus-sales-automation"
version = "1.0.0"
description = "AI-assisted B2B sales automation for lead discovery, enrichment, outreach, CRM synchronization, follow-ups, and social publishing."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "python-dotenv>=1.0.0",
  "anthropic>=0.105.0",
  "hubspot-api-client>=12.0.0",
  "pandas>=2.0.0",
  "requests>=2.31.0",
  "schedule>=1.2.0",
  "Flask>=3.0.0",
]

[tool.pyright]
include = ["app.py", "run.py", "engine"]
exclude = ["**/__pycache__"]
