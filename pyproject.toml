[tool.pyrefly]
# Points Pyrefly to the project venv so all installed packages resolve
python-interpreter-path = "./venv/bin/python3"
site-package-path = "./venv/lib/python3.9/site-packages"
search-path = ["."]

# Suppress false positives from Pyrefly virtual in-memory analysis buffers
ignore = [
  "__pyrefly_virtual__/**",
]
